[package]
name = "sbms-capture-diagnostics"
version = "2.2.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace]

[dependencies]
minhook = "=0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Enumeration_Pnp", "Win32_Devices_Properties",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation",
    "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
] }
