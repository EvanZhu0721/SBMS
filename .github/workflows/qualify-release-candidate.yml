name: Qualify release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full candidate commit SHA.
        required: true
        type: string
      windows_ci_run_id:
        description: Successful Windows CI run that retained contracts, package, and integration evidence.
        required: true
        type: string
      hardware_run_id:
        description: Successful hardware-evidence run for the exact retained candidate payload.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: qualify-release-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}
      - name: Bind checkout to candidate
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          $candidate = $env:CANDIDATE_SHA.Trim().ToLowerInvariant()
          if ($candidate -notmatch '^[0-9a-f]{40}$') {
            throw 'candidate_sha must be a full 40-character Git commit.'
          }
          if ((git rev-parse HEAD).Trim().ToLowerInvariant() -cne $candidate) {
            throw 'The checkout does not match candidate_sha.'
          }
      - name: Verify workflow run provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WINDOWS_CI_RUN_ID: ${{ inputs.windows_ci_run_id }}
          HARDWARE_RUN_ID: ${{ inputs.hardware_run_id }}
        run: |
          $candidate = $env:CANDIDATE_SHA.Trim().ToLowerInvariant()
          foreach ($runId in @($env:WINDOWS_CI_RUN_ID, $env:HARDWARE_RUN_ID)) {
            if ($runId -notmatch '^[1-9][0-9]*$') {
              throw 'Workflow run identifiers must be positive decimal integers.'
            }
          }
          $headers = @{
            Authorization = 'Bearer ' + $env:GH_TOKEN
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          function Get-TrustedRun {
            param(
              [string] $RunId,
              [string] $ExpectedWorkflowPath,
              [string[]] $AllowedEvents
            )
            $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$RunId"
            $run = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
            $workflowPath = ([string]$run.path).Split('@')[0]
            if ([string]$run.id -cne $RunId) {
              throw "GitHub returned a different workflow run for $RunId."
            }
            if ($workflowPath -cne $ExpectedWorkflowPath) {
              throw "Run $RunId is from $workflowPath, not $ExpectedWorkflowPath."
            }
            if ([string]$run.head_sha -cne $candidate) {
              throw "Run $RunId does not target candidate $candidate."
            }
            if ([string]$run.conclusion -cne 'success') {
              throw "Run $RunId did not conclude successfully."
            }
            if ($AllowedEvents -notcontains [string]$run.event) {
              throw "Run $RunId has unexpected event $($run.event)."
            }
            return [ordered]@{
              runId = [string]$run.id
              workflowPath = $workflowPath
              headSha = ([string]$run.head_sha).ToLowerInvariant()
              conclusion = [string]$run.conclusion
              event = [string]$run.event
              htmlUrl = [string]$run.html_url
            }
          }
          $trustedRuns = [ordered]@{
            schemaVersion = 1
            candidateCommit = $candidate
            windowsCi = Get-TrustedRun `
              -RunId $env:WINDOWS_CI_RUN_ID `
              -ExpectedWorkflowPath '.github/workflows/windows-ci.yml' `
              -AllowedEvents @('pull_request', 'push', 'workflow_dispatch')
            hardware = Get-TrustedRun `
              -RunId $env:HARDWARE_RUN_ID `
              -ExpectedWorkflowPath '.github/workflows/hardware-evidence.yml' `
              -AllowedEvents @('workflow_dispatch')
          }
          $root = Join-Path $env:RUNNER_TEMP 'qualification'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $json = $trustedRuns | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText(
            (Join-Path $root 'trusted-runs.json'),
            $json,
            [Text.UTF8Encoding]::new($false))
      - name: Download contract evidence
        uses: actions/download-artifact@v4
        with:
          pattern: contracts-*
          path: ${{ runner.temp }}/qualification/contracts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_ci_run_id }}
      - name: Download build and integration evidence
        uses: actions/download-artifact@v4
        with:
          name: clean-build-reports
          path: ${{ runner.temp }}/qualification/clean-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_ci_run_id }}
      - name: Download hardware evidence
        uses: actions/download-artifact@v4
        with:
          pattern: hardware-*-${{ inputs.candidate_sha }}-${{ inputs.hardware_run_id }}
          path: ${{ runner.temp }}/qualification/hardware
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.hardware_run_id }}
      - name: Verify and assemble immutable evidence bundle
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WINDOWS_CI_RUN_ID: ${{ inputs.windows_ci_run_id }}
          HARDWARE_RUN_ID: ${{ inputs.hardware_run_id }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'qualification'
          $bundle = Join-Path $root 'bundle'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          ./Confirm-SBMSReleaseCandidateEvidence.ps1 `
            -CandidateCommit $env:CANDIDATE_SHA `
            -ContractsRoot (Join-Path $root 'contracts') `
            -CleanBuildRoot (Join-Path $root 'clean-build') `
            -HardwareRoot (Join-Path $root 'hardware') `
            -WindowsCiRunId $env:WINDOWS_CI_RUN_ID `
            -HardwareRunId $env:HARDWARE_RUN_ID `
            -TrustedRunsPath (Join-Path $root 'trusted-runs.json') `
            -OutputPath (Join-Path $bundle 'evidence-index.json')
          Copy-Item -LiteralPath (Join-Path $root 'contracts') -Destination (Join-Path $bundle 'contracts') -Recurse
          Copy-Item -LiteralPath (Join-Path $root 'clean-build/package') -Destination (Join-Path $bundle 'package-report') -Recurse
          Copy-Item -LiteralPath (Join-Path $root 'clean-build/integration') -Destination (Join-Path $bundle 'integration-report') -Recurse
          Copy-Item -LiteralPath (Join-Path $root 'clean-build/candidate') -Destination (Join-Path $bundle 'candidate') -Recurse
          Copy-Item -LiteralPath (Join-Path $root 'hardware') -Destination (Join-Path $bundle 'hardware') -Recurse
          Copy-Item -LiteralPath (Join-Path $root 'trusted-runs.json') -Destination (Join-Path $bundle 'trusted-runs.json')
      - name: Upload qualified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: qualified-release-candidate-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/qualification/bundle
          if-no-files-found: error
          retention-days: 90
