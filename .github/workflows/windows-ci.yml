name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (${{ matrix.name }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            executable: pwsh.exe
            report: contracts-pwsh
          - name: Windows PowerShell 5.1
            executable: powershell.exe
            report: contracts-winps
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify clean checkout
        shell: pwsh
        run: |
          if (git status --porcelain) {
            throw 'Checkout is not clean.'
          }
      - name: Run contract suite
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP '${{ matrix.report }}'
          ./invoke-sbms-ci.ps1 `
            -Suite contracts `
            -OutputDirectory $output `
            -PowerShellExecutable '${{ matrix.executable }}' `
            -RequireCleanSource
          Get-Content -LiteralPath (Join-Path $output 'summary.md') -Raw |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.report }}
          path: ${{ runner.temp }}/${{ matrix.report }}
          if-no-files-found: error
          retention-days: 90

  clean-build-package:
    name: Clean build, package, and smoke
    needs: contracts
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory clean toolchain
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'clean-build'
          New-Item -ItemType Directory -Path $report -Force | Out-Null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $inventory = [ordered]@{
            image = $env:ImageOS
            imageVersion = $env:ImageVersion
            pwsh = $PSVersionTable.PSVersion.ToString()
            git = (git --version)
            visualStudio = if (Test-Path $vswhere) {
              & $vswhere -latest -products * -property installationPath
            } else { '' }
            windowsKits = @(Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Directory -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name)
          }
          $inventory | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $report 'toolchain.json') -Encoding UTF8
          if (git status --porcelain) {
            throw 'Checkout is not clean before build.'
          }
      - name: Build and verify clean package
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'clean-build'
          ./invoke-sbms-ci.ps1 `
            -Suite package `
            -OutputDirectory (Join-Path $report 'package') `
            -PowerShellExecutable pwsh.exe `
            -RequireCleanSource
          Get-Content -LiteralPath (Join-Path $report 'package/summary.md') -Raw |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Retain exact candidate payload
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'clean-build'
          ./package-sbms.ps1 `
            -SkipProgramFiles `
            -SkipSourceCopy `
            -OutputRoot (Join-Path $report 'candidate')
      - name: Run integration and UI smoke against retained candidate bytes
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'clean-build'
          ./invoke-sbms-ci.ps1 `
            -Suite integration `
            -OutputDirectory (Join-Path $report 'integration') `
            -PowerShellExecutable pwsh.exe
          Get-Content -LiteralPath (Join-Path $report 'integration/summary.md') -Raw |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Upload clean-build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-build-reports
          path: ${{ runner.temp }}/clean-build
          if-no-files-found: error
          retention-days: 90
