name: Code history

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/readme/code-history.svg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-history-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate chart
        run: python3 scripts/generate-code-history.py

      - name: Commit updated chart
        run: |
          git add assets/readme/code-history.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update code history chart'
          git push origin HEAD:main
