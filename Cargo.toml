[package]
name = "sbms"
version = "0.2.9"
edition = "2024"
publish = false
default-run = "sbms"

[build-dependencies]
slint-build = "1.17.1"

[dependencies]
slint = { version = "1.17.1", default-features = false, features = [
    "accessibility",
    "backend-winit",
    "compat-1-2",
    "renderer-software",
    "software-renderer-systemfonts",
    "std",
    "system-tray",
] }
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Devices_Enumeration_Pnp",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "sbms-tray"
path = "src/bin/sbms-tray.rs"
